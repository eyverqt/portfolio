# La clave web de Firebase no vive en git: se pone al publicar.
# FORJA_FIREBASE_API_KEY se define en Netlify > Site configuration > Environment variables.
[build]
  publish = "."
  command = "node scripts/inyectar-config.mjs"

[build.environment]
  # La app necesita esa clave en el navegador: el escáner de Netlify no debe frenarla ahí.
  SECRETS_SCAN_OMIT_PATHS = "forja/app/assets/*"
